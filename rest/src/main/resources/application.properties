spring.application.name=rest

# Market Data Providers Configuration
cotatrack.providers.order=TRADING_VIEW,YAHOO_CHART,BRAPI
cotatrack.providers.tradingview.enabled=true
cotatrack.providers.yahoochart.enabled=true
cotatrack.providers.brapi.enabled=true
cotatrack.providers.brapi.token=${BRAPI_TOKEN:}

# Cache TTLs Configuration
cotatrack.cache.quote-intraday-ttl=5m
cotatrack.cache.history-daily-ttl=12h
cotatrack.cache.dividends-ttl=24h
cotatrack.cache.logo-ttl=7d
cotatrack.cache.stale-ttl=24h

# US stocks are opt-in; external redistribution requires appropriate provider rights.
cotatrack.stocks.enabled=${COTATRACK_STOCKS_ENABLED:false}
cotatrack.stocks.api-key=${TWELVE_DATA_API_KEY:}
cotatrack.stocks.timeout=PT3S
cotatrack.stocks.credits-per-minute=8
cotatrack.stocks.credits-per-day=800
cotatrack.stocks.fundamentals-enabled=false
# Credit weights must match the contracted Twelve Data plan.
cotatrack.stocks.credits.stocks=1
cotatrack.stocks.credits.quote=1
cotatrack.stocks.credits.time_series=1
cotatrack.stocks.credits.profile=10
cotatrack.stocks.credits.statistics=50
cotatrack.stocks.credits.logo=1
cotatrack.stocks.credits.dividends=20
cotatrack.stocks.credits.splits=20